name: agent-issue

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    # Never run on issues created by the agent itself (release digests etc.).
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main        # trusted code only
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install opencode
        run: npm install --global @opencode/cli

      - name: Triage issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          DEFAULT_MODEL: ${{ vars.AGENT_MODEL }}
          FALLBACK_MODEL: ${{ vars.AGENT_FALLBACK_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          ./.agent/bin/agent-issue.sh "$ISSUE_NUMBER"

      # Upload the transcript for auditability even when the run fails.
      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-${{ github.event.issue.number || github.event.inputs.issue_number }}-agent-log
          path: .agent/out/run.log
          retention-days: 14
          if-no-files-found: ignore
